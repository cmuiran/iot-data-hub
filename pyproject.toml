[project]
name = "iot-data-hub"
version = "0.6.0"
description = "Industrial IoT Data Hub"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",        # config and data models
    "PyYAML>=6.0",             # YAML config files
    "pymodbus>=3.7,<4",        # Modbus TCP driver (client only)
    "aiomqtt>=2.3,<3",         # MQTT driver
    "asyncua>=1.1",            # OPC UA driver (and the OPC UA simulator)
    "fastapi>=0.115",          # backend API
    "uvicorn>=0.30",           # ASGI server for the backend
    "websockets>=12",          # WebSocket transport for uvicorn (live data)
    "psycopg[binary]>=3.2",    # PostgreSQL store
    "psycopg-pool>=3.2",       # connection pool for the PostgreSQL store
    "argon2-cffi>=23",         # password hashing
    "PyJWT>=2.9",              # access tokens
    "openpyxl>=3.1",           # Excel report export (also used by the add-device importer)
    "tzdata>=2024.1",          # time zones on Windows (reports, backups, schedules)
    "pyserial>=3.5",           # Modbus RTU on serial ports / RFC 2217 serial servers
    "httpx>=0.27",             # notifications, and the HTTP/REST driver
    "python-snap7>=3.3,<4",    # Siemens S7 driver (pure Python, asyncio client; its server = the S7 simulator)
    "pysnmp>=7.1,<8",          # SNMP driver (v2c/v3, asyncio; its agent engine = the SNMP simulator)
    "ldap3>=2.9,<3",           # sign-in with Active Directory / LDAP (pure Python; config/ldap.yaml)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",    # async tests (drivers, simulators, API)
    "amqtt>=0.11",             # in-process MQTT broker for tests and the local simulator
    "pgserver>=0.1.4",         # throw-away PostgreSQL for the store tests (no install needed)
    "aiosmtpd>=1.4",           # local SMTP server for the e-mail notification tests
    "ruff>=0.6",               # lint (CI and scripts/check.py)
    "bandit>=1.7",             # static security analysis (CI)
    "pip-audit>=2.7",          # known vulnerabilities in the dependencies (CI)
    "psutil>=5.9",             # CPU/memory figures of hub-loadtest
]

[project.scripts]
hub = "hub.main:main"
hub-commission = "hub.commission:main"
hub-api = "backend.server:main"
hub-sim = "simulators.run:main"
hub-admin = "backend.admin:main"
hub-loadtest = "simulators.loadtest:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hub*", "backend*", "simulators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: talks to a simulator over a real socket (still no hardware)",
    "postgres: needs PostgreSQL (pgserver or HUB_TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:amqtt.*",
    "ignore::DeprecationWarning:asyncua.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["RadarWebConsole", ".claude/skills/*/evals", "_skill_staging", ".sim", ".preview"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "ASYNC"]
ignore = [
    "UP046",     # Generic[...] base classes read fine and keep mypy/pyright happy on 3.12
    "ASYNC109",  # explicit timeout= parameters on helpers are deliberate
]

[tool.ruff.lint.per-file-ignores]
# tests poll with sleep loops and run blocking helpers on purpose
"tests/**" = ["ASYNC110", "ASYNC221", "ASYNC240", "B017"]
"simulators/**" = ["ASYNC110"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "RadarWebConsole", "_skill_staging", ".sim", ".preview"]
# Reviewed, project-wide (docs/security-assessment.md): asserts only state invariants after the
# real checks; try/except/pass only in disconnect cleanup; subprocess runs pg_dump/pg_restore with
# argument lists (no shell) from configured paths. Single findings use "# nosec <id> - reason".
skips = ["B101", "B110", "B404", "B603"]
