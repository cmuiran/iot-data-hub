# Hub + PostgreSQL with TimescaleDB on one Linux host (docs/backend.md section 26).
#
#   cp .env.example .env      # set HUB_JWT_SECRET, HUB_DATA_KEY, POSTGRES_PASSWORD, device secrets
#   docker compose up -d
#   docker compose exec hub hub-admin create-admin --username <name>
#
# Field devices must be reachable from the host. Modbus/S7/OPC UA need no extra ports; for the
# OPC UA server or Modbus server outputs, publish their ports below as well.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_app -d hub"]
      interval: 10s
      timeout: 5s
      retries: 10
    # not published: only the hub talks to the database

  hub:
    build: .
    image: iot-data-hub:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HUB_DATABASE_URL: postgresql://hub_app:${POSTGRES_PASSWORD}@db:5432/hub
      HUB_PG_DUMP: /usr/bin/pg_dump
    ports:
      - "8000:8000"          # put HTTPS in front (HUB_TLS_CERT/HUB_TLS_KEY or a reverse proxy)
    volumes:
      - ./config:/app/config
      - ./pki:/app/pki
      - hub-logs:/app/logs
      - ./backups:/app/backups
      - hub-spool:/app/spool        # store & forward backlog survives container restarts
    stop_grace_period: 30s

volumes:
  db-data:
  hub-logs:
  hub-spool:
